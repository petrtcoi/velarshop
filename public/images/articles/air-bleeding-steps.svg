<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Как выпустить воздух через ручной воздухоотводчик</title><desc id="desc">Подготовить емкость, осторожно открыть регулировочный винт, дождаться воды без воздуха, закрыть винт и проверить герметичность.</desc>
<rect width="640" height="420" fill="#fafafa"/><g font-family="Arial,sans-serif" fill="#262626" font-size="20">
<g transform="translate(24 24)"><text fill="#b91c1c" font-size="28">1</text><text x="38" y="0">Подготовьте емкость</text><path d="M85 72h110l-12 75h-86z" fill="#e5e5e5" stroke="#525252" stroke-width="3"/><path d="M65 35h150v20H65z" fill="#fff" stroke="#525252" stroke-width="3"/><path d="M208 45h35v35" fill="none" stroke="#525252" stroke-width="5"/><text x="20" y="178" font-size="17">Защитите пол, дайте прибору остыть</text></g>
<g transform="translate(340 24)"><text fill="#b91c1c" font-size="28">2</text><text x="38" y="0">Приоткройте винт</text><circle cx="130" cy="86" r="43" fill="#fff" stroke="#525252" stroke-width="4"/><path d="M112 86h36" stroke="#525252" stroke-width="6"/><path d="M155 28a60 60 0 0 0-77 38" fill="none" stroke="#b91c1c" stroke-width="5"/><path d="m78 66-6-14 18 5z" fill="#b91c1c"/><text x="12" y="178" font-size="17">Не выкручивайте винт полностью</text></g>
<g transform="translate(24 238)"><text fill="#b91c1c" font-size="28">3</text><text x="38" y="0">Выпустите воздух</text><path d="M60 40h160v20H60zM213 50h30v22" fill="#fff" stroke="#525252" stroke-width="4"/><path d="M243 88q-14 19 0 23q14-4 0-23" fill="#4b86a6"/><path d="M89 101h115l-12 40h-90z" fill="#e5e5e5" stroke="#525252" stroke-width="3"/><text x="23" y="169" font-size="17">Дождитесь воды без пузырьков</text></g>
<g transform="translate(340 238)"><text fill="#b91c1c" font-size="28">4</text><text x="38" y="0">Закройте винт</text><circle cx="130" cy="83" r="43" fill="#fff" stroke="#525252" stroke-width="4"/><path d="M112 83h36" stroke="#525252" stroke-width="6"/><path d="m201 72 15 15 28-31" fill="none" stroke="#52765e" stroke-width="6"/><text x="22" y="169" font-size="17">Убедитесь, что клапан не течет</text></g></g></svg>
